name: generate snake animation

on:
  # run automatically every day
  schedule:
    - cron: "30 1 * * *"

  # allows manual runs from the Actions tab
  workflow_dispatch:

  # regenerate on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates light + dark snake SVGs from the contribution grid
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # push dist/ to the "output" branch
      # files land at https://raw.githubusercontent.com/ericjdz/ericjdz/output/<file>
      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
